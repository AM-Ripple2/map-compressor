<!doctype html>
<!-- Map Compressor (offline edition). Generated by tools/build-offline.mjs: edit web/template.html and web/app.js instead. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Block every network request except the optional basemap tiles, even if something tried. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:; worker-src blob:; style-src 'unsafe-inline'; img-src data: blob: https://server.arcgisonline.com; connect-src data: blob: https://server.arcgisonline.com; font-src data:">
<title>Map Compressor</title>
<!-- INLINE_CSS -->
<style>
  :root { color-scheme: dark; --bg:#1b1f26; --panel:#232934; --text:#e6e9ef; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .app { display:grid; grid-template-columns: 380px 1fr; height:100%; }
  aside { background:var(--panel); overflow-y:auto; border-right:1px solid #333a46; }
  header { padding:14px 12px 0; }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; font-size:12.5px; opacity:.7; }
  .net { margin:10px 0 0; padding:7px 9px; border-radius:6px; font-size:12px; line-height:1.35; }
  .net-off { background:rgba(47,179,68,.15); color:#7fdc8e; }
  .net-on { background:rgba(247,103,7,.18); color:#ffb07a; }
  .basemap { display:flex; gap:8px; align-items:center; margin-top:8px; font-size:13px; cursor:pointer; }
  #map { height:100%; }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; }
    #map { grid-row: 1; } aside { grid-row: 2; border-right:0; border-top:1px solid #333a46; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Map Compressor</h1>
      <p>GeoTIFF / drone orthomosaic → small georeferenced overlay (GeoTIFF with transparency, or KMZ) for TAK clients. Runs entirely on this device.</p>
      <div id="net-status" class="net net-off">Offline: nothing leaves this device.</div>
      <label class="basemap"><input type="checkbox" id="basemap"> Show online satellite basemap (Esri)</label>
    </header>
    <div id="panel"></div>
  </aside>
  <div id="map"></div>
</div>
<!-- INLINE_JS -->
</body>
</html>
